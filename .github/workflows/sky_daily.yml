name: SKY giornaliero

on:
  schedule:
    - cron: '30 4 * * *'         # 04:30 UT: i dati di ieri sono completi (ritardo BGS ~3h)
  workflow_dispatch:
    inputs:
      day:
        description: 'Giornata AAAA-MM-GG (vuoto = ieri)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sky-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy pandas

      - name: Giornata
        id: d
        run: |
          D="${{ inputs.day }}"; [ -z "$D" ] && D=$(date -u -d yesterday +%F)
          echo "day=$D" >> "$GITHUB_OUTPUT"

      - name: Scarica stazioni (sky_d)
        env:
          SKY_OUT: data/days
          SKY_STATION_FILES: '0'
        run: mkdir -p data/days && python sky_d.py ${{ steps.d.outputs.day }}

      - name: Aggiungi vento solare dall'archivio
        run: |
          D=${{ steps.d.outputs.day }}; F=data/days/SKY_$D
          N=$(date -u -d "$D +1 day" +%Y%m%d)
          cp data/noaa/NOAA_*_${D//-/}T*.json data/noaa/NOAA_*_${N}T*.json "$F"/ 2>/dev/null || true
          cp data/sun/SUN_*_${N}T*.* "$F"/ 2>/dev/null || cp data/sun/SUN_*_${D//-/}T*.* "$F"/ 2>/dev/null || true
          ls "$F"

      - name: Analisi (sky_scan)
        run: python sky_scan.py data/days/SKY_${{ steps.d.outputs.day }}

      - name: Comprimi il file unico
        run: gzip -f data/days/SKY_${{ steps.d.outputs.day }}/TUTTE_*.csv

      - name: Conserva tutti i file 90 giorni (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SKY_${{ steps.d.outputs.day }}
          path: data/days/SKY_${{ steps.d.outputs.day }}
          retention-days: 90

      - name: Commit file del giorno e registri in data/
        run: |
          D=${{ steps.d.outputs.day }}
          for f in data/days/SKY_REGISTRO.csv data/days/SKY_EVENTI.csv data/days/SKY_SOLE.csv data/days/SKY_SINCRONISMI.csv data/days/SKY_SERIE_EVENTI.csv data/days/SKY_MARKER.csv data/days/SKY_MOMENTI.csv data/days/SKY_$D/SCAN_$D.txt data/days/SKY_$D/RIEPILOGO.txt data/days/SKY_$D/TUTTE_$D.csv.gz
          do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || {
            git config user.name  "sky-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "SKY giornaliero $D"
            git push || { git pull --rebase --autostash origin main; git push; }
          }

      - name: Messaggio alle 08:30 ora italiana
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          D=${{ steps.d.outputs.day }}
          T=$(TZ=Europe/Rome date -d "08:30" +%s)
          NOW=$(date +%s)
          AT=""; [ "$T" -gt "$((NOW+60))" ] && AT="$T"
          curl -sS -H "Title: SKY $D pronto" ${AT:+-H "At: $AT"} \
            -d "File pronti in data/days/SKY_$D (SCAN, RIEPILOGO, TUTTE)" \
            "https://ntfy.sh/$NTFY_TOPIC" || true

      - name: Avviso immediato se errore
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS -H "Title: SKY ERRORE" -H "Priority: high" \
            -d "Giornata ${{ steps.d.outputs.day }}: il workflow non è andato a buon fine" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
