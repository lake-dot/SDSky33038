name: SKY

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_morning:
        description: 'Forza il riassunto mattutino'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests numpy

      - name: Riassunto già inviato oggi?
        id: morning
        run: |
          D=$(date -u +%F)
          if [ "$(cat .morning_sent 2>/dev/null)" = "$D" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SKY check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MORNING_ALREADY: ${{ steps.morning.outputs.already }}
          FORCE_MORNING: ${{ inputs.force_morning }}
        run: python sky_stateless.py

      - name: Segna riassunto inviato (commit giornaliero, mantiene attivo il cron)
        run: |
          if [ -f .morning_flag ]; then
            date -u +%F > .morning_sent
            rm -f .morning_flag
            git config user.name  "sky-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .morning_sent
            git commit -m "riassunto inviato $(date -u +%F)"
            git push
          fi
