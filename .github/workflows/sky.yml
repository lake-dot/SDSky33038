name: SKY

on:
  schedule:
    - cron: '*/15 * * * *'        # ogni 15 minuti
  workflow_dispatch:              # bottone "Run" manuale
    inputs:
      force_morning:
        description: 'Forza il riassunto mattutino'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests numpy
        # quando vorrai l'astronomia: pip install requests numpy pyswisseph

      - name: SKY check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_MORNING: ${{ github.event.inputs.force_morning }}
        run: python sky_stateless.py

      - name: Heartbeat (mantiene lo schedule attivo)
        if: github.event_name == 'schedule'
        run: |
          D=$(date -u +%F)
          if [ "$(cat heartbeat.txt 2>/dev/null)" != "$D" ]; then
            echo "$D" > heartbeat.txt
            git config user.name  "sky-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "heartbeat $D"
            git push
          fi
