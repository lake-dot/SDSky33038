name: SKY NOAA

on:
  schedule:
    - cron: '15 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sky-noaa
  cancel-in-progress: false

jobs:
  noaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python noaa_fetch.py
      - run: python solar_fetch.py
      - name: Commit archivio NOAA
        run: |
          git add -A data/noaa data/sun
          git diff --cached --quiet || {
            git config user.name  "sky-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "NOAA $(date -u +%FT%TZ)"
            git push || { git pull --rebase --autostash origin main; git push; }
          }
